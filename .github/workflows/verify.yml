name: Verify gateway

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-sdk.txt
      - name: Backend tests and SDK fixtures
        run: ./gradlew test build :backend:generateSdkFixtures --no-daemon
      - name: SDK compatibility
        run: |
          python -m pip install -r scripts/requirements-sdk.txt
          python scripts/verify-sdk.py
      - name: Frontend build and browser
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build
          npm --prefix frontend exec -- playwright install --with-deps --only-shell chromium
      - name: Start isolated production stack
        run: |
          python scripts/prepare-verification.py "$RUNNER_TEMP/llm-gateway-check"
          set -a
          . "$RUNNER_TEMP/llm-gateway-check/stack.env"
          set +a
          docker compose --env-file "$RUNNER_TEMP/llm-gateway-check/stack.env" \
            -f deployment/docker-compose.yml -f deployment/docker-compose.production.yml \
            -f deployment/docker-compose.test.yml up --build -d --wait --wait-timeout 180
          python scripts/verify-deployment.py "$RUNNER_TEMP/llm-gateway-check/stack.env"
      - name: Browser and bounded runtime verification
        run: |
          set -a
          . "$RUNNER_TEMP/llm-gateway-check/stack.env"
          set +a
          PROVIDER_FIXTURE_HOST="$(docker network inspect "${COMPOSE_PROJECT_NAME}_default" --format '{{(index .IPAM.Config 0).Gateway}}')"
          export PROVIDER_FIXTURE_HOST
          npm --prefix frontend run test:e2e -- --reporter=list
          node scripts/verify-runtime.mjs
      - name: Remove isolated stack
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/llm-gateway-check/stack.env" ]; then
            set -a
            . "$RUNNER_TEMP/llm-gateway-check/stack.env"
            set +a
            verification_cleanup_status=0
            docker compose --env-file "$RUNNER_TEMP/llm-gateway-check/stack.env" \
              -f deployment/docker-compose.yml -f deployment/docker-compose.production.yml \
              -f deployment/docker-compose.test.yml down --volumes || verification_cleanup_status=$?
            rm -f "$RUNNER_TEMP/llm-gateway-check/stack.env" "$RUNNER_TEMP/llm-gateway-check/provider-keyring.json"
            exit "$verification_cleanup_status"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            backend/build/reports/tests/test
            frontend/test-results
            docs/verification/runtime-benchmark.json
